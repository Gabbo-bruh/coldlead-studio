name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get?
      placeholder: coldlead scout "Ristorante" "Firenze" --source osm …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `coldlead doctor`
      render: text
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
