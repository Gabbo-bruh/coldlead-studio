[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coldlead-studio"
dynamic = ["version"]
description = "Scientific B2B lead scouting for VibeCoding studios: Precision Opportunity Score, instant re-scoring, outreach Action Kits. CLI, MCP server, agent skill and local dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gabriele Crema" }]
keywords = [
  "lead-generation",
  "lead-scoring",
  "prospecting",
  "b2b",
  "mcp",
  "model-context-protocol",
  "vibecoding",
  "cli",
  "fastapi",
  "agent-skills",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "httpcore>=1.0",
  "beautifulsoup4>=4.12",
  "rich>=13.7",
  "typer>=0.15",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.32"]
mcp = ["mcp>=2.2,<3"]
all = ["coldlead-studio[web,mcp]"]

[project.scripts]
coldlead = "coldlead.cli:main"

[project.urls]
Homepage = "https://github.com/Gabbo-bruh/coldlead-studio"
Documentation = "https://github.com/Gabbo-bruh/coldlead-studio#readme"
Issues = "https://github.com/Gabbo-bruh/coldlead-studio/issues"
Changelog = "https://github.com/Gabbo-bruh/coldlead-studio/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "jsonschema>=4.23",
  "ruff>=0.9",
]

[tool.hatch.version]
path = "src/coldlead/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coldlead"]

[tool.hatch.build.targets.sdist]
include = ["src/coldlead", "tests", "schema", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.coverage.run]
source = ["coldlead"]
omit = ["src/coldlead/__main__.py"]
